name: Satellite Scene Classification CI/CD

on:
  push:
  pull_request:
    branches:
      - develop
      - main

env:
  ACR_NAME: satellitescenereg2711
  ACR_LOGIN_SERVER: satellitescenereg2711.azurecr.io
  RESOURCE_GROUP: rg-satellite-scene-classification
  BACKEND_APP: satellite-backend
  FRONTEND_APP: satellite-frontend

permissions:
  contents: read

jobs:
  test:
    name: Code Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Ruff lint
        run: |
          ruff check backend frontend tests evaluation

      - name: Ruff format check
        run: |
          ruff format --check backend frontend tests evaluation

      - name: Mypy type check
        run: |
          mypy backend --ignore-missing-imports

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v \
            --cov=backend.main \
            --cov-report=term-missing \
            --cov-fail-under=70

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Azure with OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/satellite-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/satellite-frontend:${{ github.sha }}

      - name: Deploy backend to Azure Container Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az containerapp update \
            --name "$BACKEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/satellite-backend:${{ github.sha }}"

      - name: Deploy frontend to Azure Container Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az containerapp update \
            --name "$FRONTEND_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/satellite-frontend:${{ github.sha }}"

      - name: Azure logout
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          az logout